<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fã-Clube Charlie Brown Jr.</title>


<link rel="stylesheet" href="style.css">


</head>

<body>

<header>


<h1>Charlie Brown Jr.</h1>

<nav>
    <ul>
        <li><a href="index.html">Voltar ao Site</a></li>
    </ul>
</nav>


</header>

<main>

<section class="contato">


<h2>Cadastro para o Fã-Clube</h2>

<form id="formContato">

    <h3>Dados Pessoais</h3>

    <input type="text" id="nome" placeholder="Nome Completo">

    <input type="text" id="apelido" placeholder="Apelido">

    <label>Data de Nascimento</label>
    <input type="date" id="nascimento">

    <input type="text" id="cpf" placeholder="CPF">

    <h3>Sexo:</h3>
    <div class="radio-grupo">
        <label><input type="radio" name="sexo"> Masculino</label>
        <label><input type="radio" name="sexo"> Feminino</label>
        <label><input type="radio" name="sexo"> Outro</label>
    </div>

    <h3>Contato</h3>

    <input type="text" id="telefone" placeholder="Telefone / WhatsApp">

    <input type="email" id="email" placeholder="E-mail">

    <input type="text" placeholder="Instagram">

    <input type="text" placeholder="Cidade">

    <input type="text" placeholder="Estado">

    <h3>Sobre Você</h3>

    <label>Como conheceu a banda?</label>

    <select>
        <option>Instagram</option>
        <option>Facebook</option>
        <option>TikTok</option>
        <option>Amigos</option>
        <option>Show</option>
        <option>Outro</option>
    </select>

    <label>Há quanto tempo acompanha o Charlie Brown Jr.?</label>

    <select>
        <option>Menos de 1 ano</option>
        <option>1 a 3 anos</option>
        <option>Mais de 3 anos</option>
    </select>

    <label>
        <input type="checkbox">
        Desejo receber novidades e lançamentos
    </label>

    <label>
        <input type="checkbox">
        Desejo participar de eventos exclusivos
    </label>

    <h3>Mensagem</h3>

    <textarea id="mensagem" rows="6" placeholder="Deixe sua mensagem"></textarea>

    <label>
        <input type="checkbox" id="aceite">
        Autorizo o contato através dos dados informados.
    </label>

    <button type="submit">Enviar Cadastro</button>

    <p id="erro"></p>

</form>

</section>

</main>

<script src="script.js"></script>

</body>

</html>
